name: Exact historical regression
on:
  push:
    branches: [qa/beast-exact-full-regression-20261127]
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3ca447ed5c10b86b245f3f60c6bd6d7097134805
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: a80a9ffbcc2a4a1616b5cfdc8c91b35c430df8fb
          path: pinned-base
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Fetch pinned scanner and run historical and current offline tests
        shell: pwsh
        run: |
          $env:BEAST_PINNED_SCANNER="$env:GITHUB_WORKSPACE\pinned-base\Scanner Nov 20"
          Set-Location 'The ultimate beast'
          $ErrorActionPreference='Continue'
          $codes=@()
          $env:PYTHONUTF8='1'
          python research/run_current_regressions.py
          $codes+=$LASTEXITCODE
          python test_spatial.py -v
          $codes+=$LASTEXITCODE
          python -m unittest discover -s fixes/FIX-011-Popup-Placement -p 'test_*.py' -v
          $codes+=$LASTEXITCODE
          python research/run_pinned_current_regressions.py
          $codes+=$LASTEXITCODE
          Write-Host "Suite exit codes: $codes"
          if (@($codes | Where-Object {$_ -ne 0}).Count -gt 0) { exit 1 }
